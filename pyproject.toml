[project]
name = "media-engine"
version = "1.0.0"  # x-release-please-version
description = "Agent-based media production framework for automated content generation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Morten", email = "morten@example.com" }
]
keywords = ["media", "video", "automation", "content-generation", "remotion"]

dependencies = [
    # Document management
    "python-frontmatter>=1.0.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "markdown>=3.5",
    # Video production
    "elevenlabs>=1.0",
    "pydub>=0.25",
    # Diagrams
    "matplotlib>=3.7",
    "pillow>=10.0",
    # Slides
    "python-pptx>=0.6",
    "openpyxl>=3.1",
    # Utilities
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "networkx>=3.6.1",
]

[project.scripts]
media-engine = "media_engine.cli:main"
media-engine-mcp = "media_engine.mcp.server:main"
media-engine-dashboard = "media_engine.web:run_dashboard"
media-engine-gui = "media_engine.gui:main"

[project.optional-dependencies]
mcp = [
    "mcp>=1.0",
]
web = [
    "fastapi>=0.109",
    "uvicorn>=0.27",
    "websockets>=12.0",
    "watchdog>=4.0",
]
pdf = [
    "weasyprint>=60.0",
]
capture = [
    "playwright>=1.40",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.1",
]
all = [
    "media-engine[mcp,web,pdf,capture]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/media_engine"]

[tool.hatch.build.targets.sdist]
include = ["python/media_engine"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = [
    "E501",  # Line too long - many legacy lines, fix incrementally
    "E741",  # Ambiguous variable name 'l' - common in list comprehensions
]

[tool.ruff.lint.per-file-ignores]
"python/tests/*" = ["E402", "F841"]  # Import order and unused vars in tests
