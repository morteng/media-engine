[project]
name = "media-engine"
version = "0.1.0"
description = "Agent-based media production framework for automated content generation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Morten", email = "morten@example.com" }
]
keywords = ["media", "video", "automation", "content-generation", "remotion"]

dependencies = [
    # Document management
    "python-frontmatter>=1.0.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "markdown>=3.5",

    # Video production
    "elevenlabs>=1.0",
    "pydub>=0.25",

    # Diagrams
    "matplotlib>=3.7",
    "pillow>=10.0",

    # Slides
    "python-pptx>=0.6",
    "openpyxl>=3.1",

    # Utilities
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.scripts]
media-engine = "media_engine.cli:main"

[project.optional-dependencies]
capture = [
    "playwright>=1.40",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/media_engine"]

[tool.hatch.build.targets.sdist]
include = ["python/media_engine"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
