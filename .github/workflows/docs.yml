# Media Engine Documentation
name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - 'python/**'
  workflow_dispatch:

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install -e ".[dev]"

      - name: Quality check
        run: |
          cd demo
          media-engine quality
          media-engine validate
