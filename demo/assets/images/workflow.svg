<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  <defs>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="300" fill="#f8fafc"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#1e293b">Content Workflow</text>

  <!-- Step 1: Create -->
  <circle cx="100" cy="150" r="45" fill="url(#stepGrad)"/>
  <text x="100" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="white">1</text>
  <text x="100" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">CREATE</text>
  <text x="100" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Write content</text>
  <text x="100" y="235" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">in Markdown</text>

  <!-- Arrow 1 -->
  <path d="M155 150 L215 150" stroke="#cbd5e1" stroke-width="3" fill="none"/>
  <polygon points="215,145 225,150 215,155" fill="#cbd5e1"/>

  <!-- Step 2: Configure -->
  <circle cx="280" cy="150" r="45" fill="url(#stepGrad)"/>
  <text x="280" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="white">2</text>
  <text x="280" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">CONFIGURE</text>
  <text x="280" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Set metadata</text>
  <text x="280" y="235" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">&amp; dependencies</text>

  <!-- Arrow 2 -->
  <path d="M335 150 L395 150" stroke="#cbd5e1" stroke-width="3" fill="none"/>
  <polygon points="395,145 405,150 395,155" fill="#cbd5e1"/>

  <!-- Step 3: Build -->
  <circle cx="460" cy="150" r="45" fill="#0ea5e9"/>
  <text x="460" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="white">3</text>
  <text x="460" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">BUILD</text>
  <text x="460" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Generate</text>
  <text x="460" y="235" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">outputs</text>

  <!-- Arrow 3 -->
  <path d="M515 150 L575 150" stroke="#cbd5e1" stroke-width="3" fill="none"/>
  <polygon points="575,145 585,150 575,155" fill="#cbd5e1"/>

  <!-- Step 4: Publish -->
  <circle cx="640" cy="150" r="45" fill="#22c55e"/>
  <text x="640" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="white">4</text>
  <text x="640" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">PUBLISH</text>
  <text x="640" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Deploy to</text>
  <text x="640" y="235" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">destination</text>

  <!-- Feedback Loop -->
  <path d="M640 195 C640 260 100 260 100 195" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="8,4" fill="none"/>
  <text x="370" y="275" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Iterate &amp; improve</text>
</svg>
