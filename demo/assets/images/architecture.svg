<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="#f8fafc"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#1e293b">Media Engine Architecture</text>

  <!-- Input Layer -->
  <rect x="50" y="100" width="150" height="60" rx="8" fill="url(#grad1)"/>
  <text x="125" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="white">Markdown</text>

  <rect x="50" y="180" width="150" height="60" rx="8" fill="url(#grad1)"/>
  <text x="125" y="215" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="white">YAML Config</text>

  <rect x="50" y="260" width="150" height="60" rx="8" fill="url(#grad1)"/>
  <text x="125" y="295" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="white">Assets</text>

  <!-- Processing -->
  <rect x="300" y="140" width="200" height="140" rx="12" fill="#0ea5e9" stroke="#0284c7" stroke-width="2"/>
  <text x="400" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="white">Media Engine</text>
  <text x="400" y="225" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="white">Build &amp; Transform</text>

  <!-- Output Layer -->
  <rect x="600" y="80" width="150" height="50" rx="8" fill="#22c55e"/>
  <text x="675" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="white">HTML</text>

  <rect x="600" y="145" width="150" height="50" rx="8" fill="#22c55e"/>
  <text x="675" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="white">PPTX</text>

  <rect x="600" y="210" width="150" height="50" rx="8" fill="#22c55e"/>
  <text x="675" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="white">XLSX</text>

  <rect x="600" y="275" width="150" height="50" rx="8" fill="#22c55e"/>
  <text x="675" y="305" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="white">Video</text>

  <!-- Arrows -->
  <path d="M200 130 L290 180" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M200 210 L290 210" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M200 290 L290 240" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <path d="M500 180 L590 105" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <path d="M500 200 L590 170" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <path d="M500 220 L590 235" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <path d="M500 240 L590 300" stroke="#94a3b8" stroke-width="2" fill="none"/>

  <!-- Labels -->
  <text x="50" y="80" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748b">INPUT</text>
  <text x="600" y="65" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748b">OUTPUT</text>
</svg>
