# Media Engine Documentation Schema
# Defines validation rules for frontmatter fields
# Uses JSON Schema format

type: object
required:
  - title
  - version
  - status
  - last_modified

properties:
  # Required fields
  title:
    type: string
    description: Document title
    minLength: 1

  version:
    type: string
    description: Semantic version (major.minor.patch)
    pattern: "^\\d+\\.\\d+\\.\\d+$"

  status:
    type: string
    description: Document status
    enum:
      - draft
      - review
      - final
      - archived

  last_modified:
    type: string
    description: Date of last modification (YYYY-MM-DD)
    pattern: "^\\d{4}-\\d{2}-\\d{2}$"

  # Optional fields
  freshness_days:
    type: integer
    description: Days before content is considered stale
    minimum: 1
    default: 60

  depends_on:
    type: array
    description: List of documents this depends on
    items:
      type: string

  tags:
    type: array
    description: Tags for categorization
    items:
      type: string

  references:
    type: array
    description: External references
    items:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
        title:
          type: string

  # Translation fields
  language:
    type: string
    description: Language code for this document
    pattern: "^[a-z]{2}(-[A-Z]{2})?$"

  source_document:
    type: string
    description: Path to source document (for translations)

  source_version:
    type: string
    description: Version of source when translation was made
    pattern: "^\\d+\\.\\d+\\.\\d+$"

  # Review tracking
  last_reviewed:
    type: string
    description: Date of last review (YYYY-MM-DD)
    pattern: "^\\d{4}-\\d{2}-\\d{2}$"

  reviewers:
    type: array
    description: List of reviewers
    items:
      type: string

  # Content metadata
  accuracy:
    type: string
    description: Accuracy level of content
    enum:
      - draft
      - estimated
      - verified
      - audited

  audience:
    type: string
    description: Target audience
    enum:
      - technical
      - business
      - investor
      - general

  # Document classification
  category:
    type: string
    description: Document category

  reference_id:
    type: string
    description: Unique reference identifier

  # Change tracking
  changes:
    type: string
    description: Summary of recent changes

  # === Hierarchy Fields ===

  # Parent-child structure
  parent_document:
    type: string
    description: Path to parent document in hierarchy

  sequence_order:
    type: integer
    description: Order among siblings (1, 2, 3...)
    minimum: 0
    default: 0

  hierarchy_level:
    type: integer
    description: Depth in hierarchy (0 = root)
    minimum: 0
    default: 0

  # Document classification
  doc_type:
    type: string
    description: Type of document in hierarchy
    enum:
      - strategy       # Vision, goals, strategic plans
      - research       # Market research, competitive analysis
      - requirements   # PRDs, user stories, specifications
      - architecture   # System design, API specs
      - implementation # Code documentation, technical guides
      - operations     # Runbooks, deployment guides
      - chapter        # General documentation chapters
      - presentation   # Slides, pitch decks
      - video          # Video content
      - diagram        # Diagrams, charts
      - data           # Data files, spreadsheets
      - reference      # Reference materials, glossaries
    default: chapter

  lifecycle:
    type: string
    description: Document lifecycle status
    enum:
      - living      # Actively maintained
      - snapshot    # Point-in-time, not updated
      - deprecated  # No longer maintained
      - archived    # Historical reference only
    default: living

  # Derivation tracking
  derived_from:
    type: array
    description: Documents this one derives from
    items:
      type: object
      properties:
        path:
          type: string
          description: Path to source document
        version:
          type: string
          description: Version of source when derived
          pattern: "^\\d+\\.\\d+\\.\\d+$"
        relationship:
          type: string
          description: How this document relates to source
          enum:
            - implements  # Technical implementation of source
            - summarizes  # Condensed version
            - extends     # Builds upon
            - translates  # Language translation
            - adapts      # Audience adaptation
            - references  # Loose reference
          default: implements

  # Ownership and governance
  owner:
    type: string
    description: Document owner (email or name)

  approvers:
    type: array
    description: Required approvers for changes
    items:
      type: string

  # Consistency anchors (key facts that must match)
  anchors:
    type: object
    description: Key facts defined in this document
    additionalProperties:
      type: object
      properties:
        value:
          description: The canonical value
        type:
          type: string
          description: Value type
          enum:
            - string
            - number
            - date
            - url
          default: string
