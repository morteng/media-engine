# Media Engine Feature Quiz
# Interactive quiz to test knowledge of media-engine features

id: feature-quiz
type: quiz
title: Media Engine Knowledge Check
description: Test your understanding of Media Engine features and capabilities.

data:
  questions:
    - id: q1
      question: "Which command shows the project health score?"
      options:
        - "media-engine status"
        - "media-engine health"
        - "media-engine quality"
        - "media-engine stats"
      correct: 1
      explanation: "The 'health' command returns a 0-100 health score with component breakdown including freshness, translation, consistency, and more."

    - id: q2
      question: "What file format does Media Engine NOT generate?"
      options:
        - "HTML"
        - "PPTX"
        - "DOCX"
        - "XLSX"
      correct: 2
      explanation: "Media Engine generates HTML, PDF, PPTX, XLSX, MP4, VTT, and diagram files, but not DOCX (Word) format."

    - id: q3
      question: "How many dashboard tabs are available in the web UI?"
      options:
        - "8 tabs"
        - "12 tabs"
        - "16 tabs"
        - "20 tabs"
      correct: 2
      explanation: "The web dashboard has 16 tabs including Overview, Documents, Translations, Freshness, Insights, Assets, Build, Quality, and more."

    - id: q4
      question: "What protocol does Media Engine use for AI agent integration?"
      options:
        - "REST API"
        - "GraphQL"
        - "MCP (Model Context Protocol)"
        - "WebSocket"
      correct: 2
      explanation: "Media Engine provides an MCP server with 16 tool modules for AI agent integration, such as with Claude."

    - id: q5
      question: "Which frontmatter field tracks translation status?"
      options:
        - "translation_id"
        - "source_document"
        - "translated_from"
        - "parent_doc"
      correct: 1
      explanation: "The 'source_document' field in frontmatter links a translation to its source, paired with 'source_version' to track freshness."

  settings:
    show_explanation: true
    allow_retry: true
    randomize: false
    passing_score: 80

width: "100%"
height: "600px"
theme: light
