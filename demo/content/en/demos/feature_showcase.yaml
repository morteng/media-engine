# Media Engine Feature Showcase
# Interactive demo showing all major capabilities

id: feature-showcase
type: comparison
title: "Media Engine Feature Showcase"
description: "Explore all the features Media Engine offers for automated media production."

data:
  items:
    - name: "Content Management"
      icon: "document"
      features:
        markdown_support: true
        frontmatter_metadata: true
        version_tracking: true
        dependency_graph: true
        multi_language: true
        status_workflow: true
        full_text_search: true
        description: "Organize content in Markdown with YAML frontmatter. Track versions, dependencies, and status across multiple languages."

    - name: "Document Generation"
      icon: "build"
      features:
        html_output: true
        pdf_output: true
        pptx_output: true
        xlsx_output: true
        diagram_output: true
        theme_support: true
        template_system: true
        description: "Generate HTML, PDF, PowerPoint, Excel, and diagrams from a single source. Consistent theming across all outputs."

    - name: "Video Production"
      icon: "video"
      features:
        yaml_scripts: true
        voiceover_tts: true
        caption_generation: true
        motion_graphics: true
        browser_capture: true
        audio_caching: true
        remotion_render: true
        description: "Full video production pipeline: scripts to voiceovers to motion graphics to final render. Automated and cached."

    - name: "Quality Assurance"
      icon: "check"
      features:
        readability_scoring: true
        link_validation: true
        reference_checking: true
        freshness_tracking: true
        schema_validation: true
        gap_analysis: true
        ci_integration: true
        description: "Automated quality checks: readability, links, references, freshness, and schema validation. CI/CD ready."

    - name: "Security"
      icon: "shield"
      features:
        secret_detection: true
        pii_scanning: true
        api_key_detection: true
        internal_url_detection: true
        audit_logging: true
        provenance_tracking: true
        approval_workflow: true
        description: "Detect secrets, PII, and sensitive content before publishing. Full audit trails and approval workflows."

    - name: "Integration"
      icon: "plug"
      features:
        cli_interface: true
        mcp_server: true
        web_dashboard: true
        python_api: true
        github_actions: true
        agent_compatible: true
        webhook_support: true
        description: "CLI, MCP server for AI agents, web dashboard, Python API. Works with Claude Desktop and any MCP client."

