# Health Metrics Visualization
# Data visualization demo showing project health components

id: health-metrics
type: data_viz
title: Project Health Dashboard
description: Visualize project health metrics and component scores.

data:
  chart_type: radar
  title: Health Score Components

  datasets:
    - label: "Current Project"
      data:
        - category: Freshness
          value: 100
        - category: Translation
          value: 100
        - category: Consistency
          value: 84
        - category: Links
          value: 92
        - category: Readability
          value: 96
        - category: Dependencies
          value: 86
        - category: Metadata
          value: 90
      color: "#3b82f6"

    - label: "Target"
      data:
        - category: Freshness
          value: 95
        - category: Translation
          value: 95
        - category: Consistency
          value: 95
        - category: Links
          value: 95
        - category: Readability
          value: 95
        - category: Dependencies
          value: 95
        - category: Metadata
          value: 95
      color: "#10b981"
      dashed: true

  options:
    show_legend: true
    show_values: true
    min: 0
    max: 100
    grid_lines: true

width: "100%"
height: "400px"
theme: light
