# Media Engine Walkthrough
# A complete tour of Media Engine's capabilities
# Duration: ~100 seconds | Resolution: 1920x1080 @ 60fps

title: "Media Engine Walkthrough"
description: "Complete tour of the agent-operated media production framework"
language: "en"

metadata:
  version: "2.0.0"
  status: "production"

narrator:
  voice: "Professional"
  speed: 1.0

output:
  resolution:
    width: 1920
    height: 1080
  framerate: 60
  filename: "media-engine-walkthrough"

scenes:
  # ============================================================
  # HOOK (0:00 - 0:05)
  # ============================================================
  - id: hook
    name: "The Problem"
    type: intro
    duration: 5
    voiceover: "You write great documentation. But turning it into polished deliverables? That takes forever... until now."
    visual:
      background: cyber
      transition_in: glitch
      text_effect: bounce

  # ============================================================
  # SOLUTION (0:05 - 0:12)
  # ============================================================
  - id: intro
    name: "Media Engine"
    type: intro
    duration: 7
    voiceover: "Media Engine automates your entire content pipeline. Write once in Markdown, publish everywhere."
    visual:
      background: aurora
      transition_in: aurora-sweep
      show_logo: true
      gradient_text: true
      glow: true

  # ============================================================
  # DASHBOARD OVERVIEW (0:12 - 0:22)
  # ============================================================
  - id: dashboard-overview
    name: "Dashboard Overview"
    type: feature
    duration: 10
    voiceover: "The dashboard gives you complete visibility. See document counts, translation status, quality scores, and content freshness at a glance."
    visual:
      background: grid
      transition_in: fade
      feature_card:
        icon: dashboard
        highlight: blue
      metrics:
        - Documents
        - Languages
        - Translations
        - Quality
        - Freshness

  # ============================================================
  # INSIGHTS (0:22 - 0:32)
  # ============================================================
  - id: insights
    name: "Project Insights"
    type: feature
    duration: 10
    voiceover: "The Insights tab shows your project health score. Track freshness, translation coverage, consistency, and more. Get actionable recommendations automatically."
    visual:
      background: particles
      transition_in: slide-left
      feature_card:
        icon: chart
        highlight: cyan
      metrics:
        - Health Score
        - Freshness
        - Translation
        - Consistency
        - Readability

  # ============================================================
  # CONTENT PREVIEW (0:32 - 0:42)
  # ============================================================
  - id: content
    name: "Rich Content Preview"
    type: feature
    duration: 10
    voiceover: "Browse documents with beautiful rendered previews. Toggle between preview, source, and edit modes. View frontmatter metadata, and manage translations across languages."
    visual:
      background: dark
      transition_in: slide-left
      feature_card:
        icon: folder
        highlight: blue
      highlights:
        - Markdown Preview
        - Edit Mode
        - Frontmatter Display
        - Multi-language

  # ============================================================
  # MEDIA GALLERY (0:42 - 0:50)
  # ============================================================
  - id: media
    name: "Media Gallery"
    type: feature
    duration: 8
    voiceover: "All your media in one place. Browse videos, audio files, and demos with instant previews. Filter by type, play directly in the browser."
    visual:
      background: gradient
      transition_in: slide-left
      feature_card:
        icon: media
        highlight: purple
      highlights:
        - Video Preview
        - Audio Player
        - Type Filtering
        - File Details

  # ============================================================
  # QUALITY CHECKS (0:50 - 1:00)
  # ============================================================
  - id: quality
    name: "Quality Assurance"
    type: feature
    duration: 10
    voiceover: "Quality checks run automatically. Catch broken links, readability issues, stale content, and security concerns before they reach production."
    visual:
      background: pulse
      transition_in: slide-left
      feature_card:
        icon: shield
        highlight: purple
      metrics:
        - Links Valid
        - Readable
        - Fresh
        - Secure

  # ============================================================
  # BUILD SYSTEM (0:52 - 1:02)
  # ============================================================
  - id: build
    name: "Build System"
    type: feature
    duration: 10
    voiceover: "Ready to publish? Select your output formats. HTML, PDF, PowerPoint, Excel. Choose languages, click build, and watch your content transform."
    visual:
      background: grid
      transition_in: slice
      feature_card:
        icon: build
        highlight: green
      icons:
        - HTML
        - PDF
        - PPTX
        - XLSX
        - MP4

  # ============================================================
  # AI INTEGRATION (1:02 - 1:12)
  # ============================================================
  - id: ai-integration
    name: "AI Agent Integration"
    type: feature
    duration: 10
    voiceover: "Connect AI agents through MCP. Twenty plus tools let you manage content, run quality checks, and trigger builds conversationally. Works with Claude Desktop out of the box."
    visual:
      background: particles
      transition_in: diagonal-split
      feature_card:
        icon: ai
        highlight: hot
      pipeline:
        - Claude Desktop
        - MCP Server
        - Media Engine
        - All Outputs

  # ============================================================
  # VIDEO PIPELINE (1:12 - 1:20)
  # ============================================================
  - id: video
    name: "Video Production"
    type: feature
    duration: 8
    voiceover: "Define video scripts in YAML. Media Engine generates voiceovers, creates captions, and renders motion graphics. This video? Built with Media Engine."
    visual:
      background: aurora
      transition_in: zoom-burst
      feature_card:
        icon: video
        highlight: cyan
      pipeline:
        - YAML Script
        - AI Voiceover
        - Auto Captions
        - Motion Graphics

  # ============================================================
  # INSTALLATION (1:20 - 1:25)
  # ============================================================
  - id: install
    name: "Get Started"
    type: demo
    duration: 5
    voiceover: "Get started in seconds."
    visual:
      background: grid
      transition_in: rotate-wipe
      terminal:
        commands:
          - "pip install media-engine"
          - "media-engine dashboard"

  # ============================================================
  # CLOSING (1:25 - 1:32)
  # ============================================================
  - id: closing
    name: "Media Engine"
    type: outro
    duration: 7
    voiceover: "Media Engine. Write content. Generate media. Ship faster."
    visual:
      background: waves
      transition_in: aurora-sweep
      show_logo: true
      gradient_text: true
      logo_glow: true
      pulse_animation: true
      cta:
        primary: "pip install media-engine"
        secondary: "github.com/morteng/media-engine"
      fade_out: true
