# Media Engine Walkthrough
# A complete tour of Media Engine's capabilities
# Duration: ~120 seconds | Resolution: 1920x1080 @ 60fps

title: "Media Engine Walkthrough"
description: "Complete tour of the agent-operated media production framework"
language: "en"

metadata:
  version: "3.1.0"
  status: "production"

narrator:
  voice: "Professional"
  speed: 1.0

output:
  resolution:
    width: 1920
    height: 1080
  framerate: 60
  filename: "media-engine-walkthrough"

# Demo clips are captured from dashboard states defined in demos/dashboard.yaml
# Clips should be pre-rendered and placed in public/demos/
demo_base_path: "demos/"

scenes:
  # ============================================================
  # HOOK (0:00 - 0:05)
  # ============================================================
  - id: hook
    name: "The Problem"
    type: intro
    duration: 5
    voiceover: "You write great documentation. But turning it into polished deliverables? That takes forever... until now."
    visual:
      background: cyber
      transition_in: glitch
      text_effect: bounce

  # ============================================================
  # SOLUTION (0:05 - 0:12)
  # ============================================================
  - id: intro
    name: "Media Engine"
    type: intro
    duration: 7
    voiceover: "Media Engine automates your entire content pipeline. Write once in Markdown, publish everywhere."
    visual:
      background: aurora
      transition_in: aurora-sweep
      show_logo: true
      gradient_text: true
      glow: true

  # ============================================================
  # DASHBOARD OVERVIEW (0:12 - 0:22) - SPLIT SCREEN
  # ============================================================
  - id: dashboard-overview
    name: "Dashboard Overview"
    type: split
    duration: 10
    title: "Complete Visibility"
    text: "Track everything in one place"
    voiceover: "The dashboard gives you complete visibility. Track your health score, publications status, AI workspace activity, and content metrics at a glance."
    demo:
      state: dashboard_overview
      clipPath: "demos/dashboard_overview.mp4"
    visual:
      transition_in: fade
      split_screen:
        demo_on_left: true
        split_angle: 15
        demo_width: 58
        highlight: cyan
        bullets:
          - "Health Score tracking"
          - "Publications status"
          - "AI Workspace activity"
          - "Content metrics"

  # ============================================================
  # CONTENT & HIERARCHY (0:22 - 0:34) - SPLIT SCREEN
  # ============================================================
  - id: content
    name: "Content Management"
    type: split
    duration: 12
    title: "Content Browser"
    text: "Navigate your documents visually"
    voiceover: "Browse documents with rich previews. Toggle between preview, source, and edit modes. Visualize your content hierarchy with tree, flow, graph, and panel views. Navigate document relationships effortlessly."
    demo:
      state: content_hierarchy_graph
      clipPath: "demos/content_hierarchy_graph.mp4"
    visual:
      transition_in: slide-left
      split_screen:
        demo_on_left: true
        split_angle: 12
        demo_width: 60
        highlight: purple
        bullets:
          - "Rich document previews"
          - "Tree, flow, graph views"
          - "Edit mode toggle"
          - "Relationship visualization"

  # ============================================================
  # QUALITY CHECKS (0:34 - 0:44) - SPLIT SCREEN
  # ============================================================
  - id: quality
    name: "Quality Assurance"
    type: split
    duration: 10
    title: "Quality Dashboard"
    text: "Built-in quality gates"
    voiceover: "Quality checks run automatically. See your health score with component breakdowns for freshness, translations, and consistency. Analyze with the knowledge graph and catch issues before production."
    demo:
      state: quality_overview
      clipPath: "demos/quality_overview.mp4"
    visual:
      transition_in: slide-left
      split_screen:
        demo_on_left: false
        split_angle: 15
        demo_width: 55
        highlight: neon
        bullets:
          - "Health score breakdown"
          - "Freshness tracking"
          - "Translation coverage"
          - "Knowledge graph analysis"

  # ============================================================
  # BRAND SYSTEM (0:44 - 0:52) - SPLIT SCREEN
  # ============================================================
  - id: brand
    name: "Brand System"
    type: split
    duration: 8
    title: "Brand Identity"
    text: "One source of truth"
    voiceover: "Manage your complete brand identity. Colors, typography, logos, and voice guidelines in one place. Every output stays on brand automatically."
    demo:
      state: brand_design
      clipPath: "demos/brand_design.mp4"
    visual:
      transition_in: slide-left
      split_screen:
        demo_on_left: true
        split_angle: 18
        demo_width: 55
        highlight: hot
        bullets:
          - "Color palettes"
          - "Typography system"
          - "Logo variants"
          - "Voice guidelines"

  # ============================================================
  # BUILD SYSTEM (0:52 - 1:04) - SPLIT SCREEN
  # ============================================================
  - id: build
    name: "Build & Publish"
    type: split
    duration: 12
    title: "One-Click Publishing"
    text: "Multiple formats, instant output"
    voiceover: "Ready to publish? Select publications, choose formats and languages. HTML, PDF, PowerPoint, Excel. Configure output options, click build, and watch your content transform into polished deliverables."
    demo:
      state: build_page
      clipPath: "demos/build_page.mp4"
    visual:
      transition_in: slice
      split_screen:
        demo_on_left: false
        split_angle: 15
        demo_width: 58
        highlight: cyan
        bullets:
          - "Publication selection"
          - "Format toggles: HTML, PDF, PPTX, XLSX"
          - "Multi-language output"
          - "Real-time build progress"

  # ============================================================
  # AI WORKSPACE (1:04 - 1:18) - SPLIT SCREEN
  # ============================================================
  - id: ai-workspace
    name: "AI Workspace"
    type: split
    duration: 14
    title: "Agent Collaboration"
    text: "AI-native content production"
    voiceover: "The AI Workspace is your command center for agent collaboration. Track sessions, manage task queues, store research findings, and capture decisions. Connect via MCP with twenty-plus tools for Claude Desktop integration."
    demo:
      state: ai_overview
      clipPath: "demos/ai_overview.mp4"
    visual:
      transition_in: diagonal-split
      split_screen:
        demo_on_left: true
        split_angle: 15
        demo_width: 55
        highlight: purple
        bullets:
          - "Session tracking"
          - "Task queue management"
          - "Research storage"
          - "Decision capture"
          - "20+ MCP tools"

  # ============================================================
  # VIDEO PIPELINE (1:18 - 1:26)
  # ============================================================
  - id: video
    name: "Video Production"
    type: feature
    duration: 8
    voiceover: "Define video scripts in YAML. Media Engine generates voiceovers, creates captions, and renders motion graphics. This video? Built with Media Engine."
    visual:
      background: aurora
      transition_in: zoom-burst
      feature_card:
        icon: video
        highlight: cyan
      pipeline:
        - YAML Script
        - AI Voiceover
        - Auto Captions
        - Motion Graphics

  # ============================================================
  # INSTALLATION (1:26 - 1:31)
  # ============================================================
  - id: install
    name: "Get Started"
    type: demo
    duration: 5
    voiceover: "Get started in seconds."
    visual:
      background: grid
      transition_in: rotate-wipe
      terminal:
        commands:
          - "pip install media-engine"
          - "media-engine dashboard"

  # ============================================================
  # CLOSING (1:31 - 1:38)
  # ============================================================
  - id: closing
    name: "Media Engine"
    type: outro
    duration: 7
    voiceover: "Media Engine. Write content. Generate media. Ship faster."
    visual:
      background: waves
      transition_in: aurora-sweep
      show_logo: true
      gradient_text: true
      logo_glow: true
      pulse_animation: true
      cta:
        primary: "pip install media-engine"
        secondary: "github.com/morteng/media-engine"
      fade_out: true
