# Media Engine Showcase Video
# Duration: ~75 seconds | Resolution: 1920x1080 @ 30fps
# For: YouTube + GitHub README

title: "Media Engine"
description: "Agent-operated media production framework showcase"
language: "en"
target_audience:
  - developers
  - technical_writers
  - content_teams

production:
  version: "1.0.0"
  status: "production"

narrator:
  voice: "Professional"
  speed: 1.0

output:
  resolution:
    width: 1920
    height: 1080
  framerate: 30
  filename: "media-engine-showcase"

scenes:
  # ============================================================
  # HOOK (0:00 - 0:05) - Grab attention immediately
  # ============================================================
  - id: hook
    name: "The Problem"
    scene_type: intro
    duration: 5
    voiceover: "You write amazing content. But publishing it? That's where you lose hours."
    background:
      type: solid
      color: dark
    visual:
      background: cyber
      transition_in: glitch
      text_effect: bounce

  # ============================================================
  # SOLUTION (0:05 - 0:12) - Introduce the product
  # ============================================================
  - id: title
    name: "Media Engine"
    scene_type: intro
    duration: 7
    voiceover: "Meet Media Engine. The framework that turns your content into professional media, automatically."
    background:
      type: solid
      color: dark
    visual:
      background: aurora
      transition_in: aurora-sweep
      show_logo: true
      gradient_text: true
      glow: true

  # ============================================================
  # CORE VALUE PROP (0:12 - 0:20) - Key differentiator
  # ============================================================
  - id: value_prop
    name: "Write Once, Publish Everywhere"
    scene_type: content
    duration: 8
    voiceover: "Write in Markdown. Get HTML, PDF, PowerPoint, Excel, and video. All from a single source."
    background:
      type: solid
      color: dark_bg
    visual:
      background: grid
      transition_in: slice
      text_effect: elastic
      icons:
        - markdown
        - arrow
        - html
        - pdf
        - pptx
        - xlsx
        - mp4

  # ============================================================
  # FEATURE 1: VIDEO PIPELINE (0:20 - 0:32)
  # ============================================================
  - id: feature_video
    name: "Automated Video Production"
    scene_type: feature
    duration: 12
    voiceover: "Define video scripts in YAML. Media Engine generates voiceovers with AI, creates captions automatically, and renders motion graphics. This video? Built with Media Engine."
    background:
      type: solid
      color: dark
    visual:
      background: particles
      transition_in: liquid
      feature_card:
        icon: video
        highlight: cyan
      pipeline:
        - YAML Script
        - AI Voiceover
        - Captions
        - Motion Graphics
        - Video

  # ============================================================
  # FEATURE 2: QUALITY (0:32 - 0:42)
  # ============================================================
  - id: feature_quality
    name: "Quality Built In"
    scene_type: feature
    duration: 10
    voiceover: "Catch problems before publishing. Readability scoring, link validation, security scanning. All automated, all integrated."
    background:
      type: solid
      color: dark
    visual:
      background: pulse
      transition_in: zoom-burst
      feature_card:
        icon: shield
        highlight: purple
      metrics:
        - Readability
        - Links Valid
        - Security Clear
        - References OK

  # ============================================================
  # FEATURE 3: AI INTEGRATION (0:42 - 0:52)
  # ============================================================
  - id: feature_ai
    name: "AI Agent Ready"
    scene_type: feature
    duration: 10
    voiceover: "Twenty plus MCP tools for AI integration. Connect Claude Desktop and manage your entire media workflow conversationally."
    background:
      type: solid
      color: dark
    visual:
      background: dark
      transition_in: diagonal-split
      feature_card:
        icon: ai
        highlight: hot
      pipeline:
        - Claude
        - MCP Server
        - Media Engine
        - All Formats

  # ============================================================
  # DEMO (0:52 - 1:02) - Show it's easy
  # ============================================================
  - id: demo
    name: "Two Commands"
    scene_type: demo
    duration: 10
    voiceover: "Get started in seconds. Install. Build. That's it."
    background:
      type: solid
      color: dark
    visual:
      background: grid
      transition_in: rotate-wipe
      terminal:
        commands:
          - "pip install media-engine"
          - "media-engine build"
      flying_outputs: true
      output_icons:
        - HTML
        - PDF
        - PPTX
        - MP4

  # ============================================================
  # CLOSING (1:02 - 1:15) - CTA
  # ============================================================
  - id: closing
    name: "Media Engine"
    scene_type: outro
    duration: 13
    voiceover: "Media Engine. Write content. Generate media. Ship faster. Star us on GitHub."
    background:
      type: solid
      color: dark
    visual:
      background: waves
      transition_in: aurora-sweep
      show_logo: true
      gradient_text: true
      logo_glow: true
      pulse_animation: true
      cta:
        primary: "pip install media-engine"
        secondary: "github.com/anthropics/media-engine"
      fade_out: true
