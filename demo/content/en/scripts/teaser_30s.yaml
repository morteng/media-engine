# Media Engine 30-Second Teaser
# Quick, punchy introduction for social media and README embeds

metadata:
  title: "Media Engine in 30 Seconds"
  description: "Quick overview of Media Engine capabilities"
  language: "en"
  duration: 30
  version: "1.0.0"
  voice_style: "energetic"
  target_audience: "developers"

scenes:
  - id: hook
    type: intro
    title: "The Hook"
    duration: 4
    content:
      text: "What if your content could build itself?"
    visual:
      background: "dark"
      text_reveal: "word-by-word"
      animation: "dramatic_reveal"
    voiceover: true
    transition: "fade"

  - id: problem
    type: content
    title: "The Pain"
    duration: 5
    content:
      text: "Documentation. Presentations. Videos. Spreadsheets. All from the same content, all by hand."
    visual:
      background: "grid"
      icons_cascade:
        - "document"
        - "presentation"
        - "video"
        - "spreadsheet"
      animation: "stack_overwhelm"
    voiceover: true
    transition: "wipe"

  - id: solution
    type: intro
    title: "Media Engine"
    duration: 3
    content:
      text: "Not anymore. Media Engine."
    visual:
      background: "gradient"
      show_logo: true
      logo_animation: "punch_in"
      accent: "copper"
    voiceover: true
    transition: "copper-sweep"

  - id: demo
    type: demo
    title: "One Command"
    duration: 8
    content:
      text: "Write in Markdown. Run one command. Get HTML, PDF, PowerPoint, Excel, and video. With voiceovers. And captions. Automatically."
    visual:
      screen_recording:
        description: "Terminal showing media-engine build with outputs appearing"
        sequence:
          - "media-engine build"
          - "Output files appearing: HTML, PDF, PPTX, XLSX, MP4"
      output_reveal:
        items: ["HTML", "PDF", "PPTX", "XLSX", "MP4"]
        animation: "cascade_reveal"
    voiceover: true

  - id: ai_angle
    type: content
    title: "AI-Powered"
    duration: 4
    content:
      text: "AI agents can run it too. Just connect to the MCP server."
    visual:
      feature_card:
        icon: "ai"
        highlight: "copper"
      badge: "MCP Ready"
      animation: "pulse_glow"
    voiceover: true

  - id: cta
    type: outro
    title: "Get Started"
    duration: 6
    content:
      text: "pip install media-engine. Star us on GitHub. Ship faster."
    visual:
      background: "gradient"
      show_logo: true
      cta: "pip install media-engine"
      stats_flash:
        - "5+ formats"
        - "20+ tools"
        - "0 busywork"
      links:
        github: "github.com/example/media-engine"
    voiceover: true
    transition: "fade_out"

voiceover:
  voice_id: ""
  style: "energetic"
  pace: "fast"

graphics:
  theme: "copper-cream"
  transitions:
    default: "copper-sweep"
  text_styles:
    heading:
      animation: "punch_in"
    body:
      animation: "fast_reveal"

audio:
  background_music:
    track: "upbeat_tech"
    volume: 0.2

render:
  resolution:
    width: 1920
    height: 1080
  fps: 30
  outputs:
    - format: "mp4"
      filename: "media-engine-teaser-30s"
    - format: "gif"
      filename: "media-engine-teaser"
      quality: "high"
      fps: 15
