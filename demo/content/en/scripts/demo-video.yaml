# Demo Video Script
# Demonstrates video builder capabilities

metadata:
  title: "Media Engine Demo"
  language: "en"
  duration: 60  # approximate
  voice_style: "professional"

scenes:
  - id: intro
    type: intro
    title: "Introduction"
    content:
      text: "Welcome to Media Engine, the agent-operated media production framework."
    visual:
      background: "gradient"
      show_logo: true

  - id: problem
    type: content
    title: "The Problem"
    content:
      text: "Creating professional documents, presentations, and videos is time-consuming. Teams spend hours on formatting and production."
    visual:
      bullets:
        - "Manual formatting"
        - "Inconsistent branding"
        - "Slow production cycles"

  - id: solution
    type: content
    title: "The Solution"
    content:
      text: "Media Engine automates production. Write content once, generate all formats automatically."
    visual:
      diagram: "architecture"

  - id: formats
    type: content
    title: "Output Formats"
    content:
      text: "Generate HTML documents, PDF reports, PowerPoint presentations, Excel spreadsheets, and video content. All from simple source files."
    visual:
      icons:
        - "html"
        - "pdf"
        - "pptx"
        - "xlsx"
        - "mp4"

  - id: caching
    type: content
    title: "Smart Caching"
    content:
      text: "Media Engine caches everything. Voiceovers, builds, and renders are only regenerated when content changes."
    visual:
      animation: "cache-flow"

  - id: closing
    type: outro
    title: "Get Started"
    content:
      text: "Install with pip install media-engine. Start building in minutes."
    visual:
      cta: "pip install media-engine"
      link: "github.com/example/media-engine"
