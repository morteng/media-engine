# Demo Arkitekturdiagram (Norsk)
# Demonstrerer diagramgeneratorens funksjoner

title: "Media Engine Arkitektur"
description: "Høynivå systemarkitektur"
language: "no"
source_document: "en/diagrams/architecture.yaml"

config:
  width: 14
  height: 10
  dpi: 150
  format: png
  font_scale: 1.0

boxes:
  # Øverste lag - Innholdskilder
  - id: markdown
    label: "Markdown\nInnhold"
    x: 0
    y: 4
    width: 1.8
    height: 0.9

  - id: yaml
    label: "YAML\nData"
    x: 2.5
    y: 4
    width: 1.8
    height: 0.9

  - id: scripts
    label: "Video\nManus"
    x: 5
    y: 4
    width: 1.8
    height: 0.9

  # Midtlag - Prosessering
  - id: cms
    label: "CMS-modul"
    x: 1.25
    y: 2
    width: 2.2
    height: 1.0
    color: "#e8f4f8"

  - id: builders
    label: "Byggere"
    x: 4
    y: 2
    width: 2.2
    height: 1.0
    color: "#e8f4f8"

  - id: video
    label: "Videopipeline"
    x: 6.75
    y: 2
    width: 2.2
    height: 1.0
    color: "#e8f4f8"

  # Nederste lag - Output
  - id: html
    label: "HTML"
    x: 0
    y: 0
    width: 1.4
    height: 0.7

  - id: pdf
    label: "PDF"
    x: 1.8
    y: 0
    width: 1.4
    height: 0.7

  - id: pptx
    label: "PPTX"
    x: 3.6
    y: 0
    width: 1.4
    height: 0.7

  - id: xlsx
    label: "XLSX"
    x: 5.4
    y: 0
    width: 1.4
    height: 0.7

  - id: mp4
    label: "MP4"
    x: 7.2
    y: 0
    width: 1.4
    height: 0.7

arrows:
  # Innhold til prosessorer
  - from: markdown
    to: cms
    label: ""

  - from: yaml
    to: builders
    label: ""

  - from: scripts
    to: video
    label: ""

  # CMS til output
  - from: cms
    to: html
    label: ""

  - from: cms
    to: pdf
    label: ""

  # Byggere til output
  - from: builders
    to: pptx
    label: ""

  - from: builders
    to: xlsx
    label: ""

  # Video til output
  - from: video
    to: mp4
    label: ""
