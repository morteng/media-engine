# Demo Kalkulator (Norsk)
# Demonstrerer XLSX-byggerens funksjoner

title: "Prosjektkalkulator"
language: "no"
source_document: "en/data/calculator.yaml"

sheets:
  - name: "Sammendrag"
    headers:
      - "Element"
      - "Antall"
      - "Pris"
      - "Total"
    rows:
      - ["Produkt A", 10, 100, "=B2*C2"]
      - ["Produkt B", 5, 200, "=B3*C3"]
      - ["Produkt C", 8, 150, "=B4*C4"]
    formulas:
      A6: "Sum"
      D6: "=SUM(D2:D5)"

  - name: "Detaljer"
    headers:
      - "Kategori"
      - "Beskrivelse"
      - "Verdi"
    rows:
      - ["Kategori 1", "Grunnleggende tjenester", 500]
      - ["Kategori 2", "Utvidede funksjoner", 750]
      - ["Kategori 3", "Premium-støtte", 250]
