# Media Engine Gjennomgang
# En komplett omvisning av Media Engines muligheter
# Varighet: ~90 sekunder | Opplosning: 1920x1080 @ 60fps

title: "Media Engine Gjennomgang"
description: "Komplett omvisning av det agent-opererte rammeverket for medieproduksjon"
language: "no"
source_document: "en/scripts/walkthrough.yaml"
source_version: "2.0.0"

metadata:
  version: "2.0.0"
  status: "production"

narrator:
  voice: "Professional"
  speed: 1.0

output:
  resolution:
    width: 1920
    height: 1080
  framerate: 60
  filename: "media-engine-gjennomgang"

scenes:
  # ============================================================
  # KROK (0:00 - 0:05)
  # ============================================================
  - id: hook
    name: "Problemet"
    type: intro
    duration: 5
    voiceover: "Du skriver god dokumentasjon. Men a gjore den om til profesjonelle leveranser? Det tar evigheter."
    visual:
      background: cyber
      transition_in: glitch
      text_effect: bounce

  # ============================================================
  # LOSNING (0:05 - 0:12)
  # ============================================================
  - id: intro
    name: "Media Engine"
    type: intro
    duration: 7
    voiceover: "Media Engine automatiserer hele innholdspipelinen din. Skriv en gang i Markdown, publiser overalt."
    visual:
      background: aurora
      transition_in: aurora-sweep
      show_logo: true
      gradient_text: true
      glow: true

  # ============================================================
  # DASHBOARD OVERSIKT (0:12 - 0:22)
  # ============================================================
  - id: dashboard-overview
    name: "Dashboard-oversikt"
    type: demo
    duration: 10
    voiceover: "Dashboardet gir deg full oversikt. Se dokumenttellinger, oversettelsesstatus, kvalitetspoeng og innholdsferskhet pa et overblikk."
    visual:
      background: dark
      transition_in: fade
    demo:
      source: dashboard
      state: overview
      highlight:
        - stats-grid
        - translation-matrix

  # ============================================================
  # INNSIKT (0:22 - 0:32)
  # ============================================================
  - id: insights
    name: "Prosjektinnsikt"
    type: feature
    duration: 10
    voiceover: "Innsikt-fanen viser prosjektets helsepoeng. Spor ferskhet, oversettelsesdekning, konsistens og mer. Fa handlingsrettede anbefalinger automatisk."
    visual:
      background: dark
      transition_in: slide-left
      feature_card:
        icon: chart
        highlight: cyan
    demo:
      source: dashboard
      state: insights
      highlight:
        - health-score
        - components

  # ============================================================
  # INNHOLDSHANDTERING (0:32 - 0:42)
  # ============================================================
  - id: content
    name: "Innholdshandtering"
    type: feature
    duration: 10
    voiceover: "Bla gjennom alle dokumenter, mediefiler og ressurser pa ett sted. Forhandsvis markdown med live-rendering, se metadata, og handter oversettelser pa tvers av sprak."
    visual:
      background: dark
      transition_in: slide-left
      feature_card:
        icon: folder
        highlight: blue
    demo:
      source: dashboard
      state: content-documents
      highlight:
        - document-browser
        - preview-panel

  # ============================================================
  # KVALITETSKONTROLL (0:42 - 0:52)
  # ============================================================
  - id: quality
    name: "Kvalitetssikring"
    type: feature
    duration: 10
    voiceover: "Kvalitetskontroller kjorer automatisk. Fang opp oydelagte lenker, lesbarhetsproblemer, utdatert innhold og sikkerhetsproblemer for de nar produksjon."
    visual:
      background: dark
      transition_in: slide-left
      feature_card:
        icon: shield
        highlight: purple
    demo:
      source: dashboard
      state: quality-report
      highlight:
        - quality-summary
        - issues-list

  # ============================================================
  # BYGGESYSTEM (0:52 - 1:02)
  # ============================================================
  - id: build
    name: "Byggesystem"
    type: demo
    duration: 10
    voiceover: "Klar til a publisere? Velg utdataformater. HTML, PDF, PowerPoint, Excel. Velg sprak, klikk bygg, og se innholdet ditt transformeres."
    visual:
      background: dark
      transition_in: slide-left
    demo:
      source: dashboard
      state: build
      highlight:
        - format-checkboxes
        - build-button
      actions:
        - click: build-button

  # ============================================================
  # AI-INTEGRASJON (1:02 - 1:12)
  # ============================================================
  - id: ai-integration
    name: "AI-agentintegrasjon"
    type: feature
    duration: 10
    voiceover: "Koble til AI-agenter gjennom MCP. Over tjue verktoy lar deg handtere innhold, kjore kvalitetskontroller og starte bygg samtalemessig. Fungerer med Claude Desktop ut av boksen."
    visual:
      background: particles
      transition_in: diagonal-split
      feature_card:
        icon: ai
        highlight: hot
      pipeline:
        - Claude Desktop
        - MCP Server
        - Media Engine
        - Alle utdata

  # ============================================================
  # VIDEOPIPELINE (1:12 - 1:20)
  # ============================================================
  - id: video
    name: "Videoproduksjon"
    type: feature
    duration: 8
    voiceover: "Definer videomanus i YAML. Media Engine genererer voiceovers, lager undertekster og rendrer motion graphics. Denne videoen? Bygget med Media Engine."
    visual:
      background: pulse
      transition_in: zoom-burst
      feature_card:
        icon: video
        highlight: cyan
      pipeline:
        - YAML-manus
        - AI Voiceover
        - Auto-undertekster
        - Motion Graphics

  # ============================================================
  # INSTALLASJON (1:20 - 1:25)
  # ============================================================
  - id: install
    name: "Kom i gang"
    type: demo
    duration: 5
    voiceover: "Kom i gang pa sekunder."
    visual:
      background: grid
      transition_in: rotate-wipe
      terminal:
        commands:
          - "pip install media-engine"
          - "media-engine dashboard"

  # ============================================================
  # AVSLUTNING (1:25 - 1:32)
  # ============================================================
  - id: closing
    name: "Media Engine"
    type: outro
    duration: 7
    voiceover: "Media Engine. Skriv innhold. Generer media. Lever raskere."
    visual:
      background: waves
      transition_in: aurora-sweep
      show_logo: true
      gradient_text: true
      logo_glow: true
      pulse_animation: true
      cta:
        primary: "pip install media-engine"
        secondary: "github.com/morteng/media-engine"
      fade_out: true
