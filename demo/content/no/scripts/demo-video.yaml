# Demo Videomanus (Norsk)
# Demonstrerer videobyggerens funksjoner

metadata:
  title: "Media Engine Demo"
  language: "no"
  duration: 60
  voice_style: "professional"
  source_document: "en/scripts/demo-video.yaml"

scenes:
  - id: intro
    type: intro
    title: "Introduksjon"
    content:
      text: "Velkommen til Media Engine, det agent-opererte rammeverket for medieproduksjon."
    visual:
      background: "gradient"
      show_logo: true

  - id: problem
    type: content
    title: "Problemet"
    content:
      text: "Å lage profesjonelle dokumenter, presentasjoner og videoer er tidkrevende. Team bruker timer på formatering og produksjon."
    visual:
      bullets:
        - "Manuell formatering"
        - "Inkonsistent merkevare"
        - "Trege produksjonssykluser"

  - id: solution
    type: content
    title: "Løsningen"
    content:
      text: "Media Engine automatiserer produksjon. Skriv innhold én gang, generer alle formater automatisk."
    visual:
      diagram: "architecture"

  - id: formats
    type: content
    title: "Outputformater"
    content:
      text: "Generer HTML-dokumenter, PDF-rapporter, PowerPoint-presentasjoner, Excel-regneark og videoinnhold. Alt fra enkle kildefiler."
    visual:
      icons:
        - "html"
        - "pdf"
        - "pptx"
        - "xlsx"
        - "mp4"

  - id: caching
    type: content
    title: "Smart caching"
    content:
      text: "Media Engine cacher alt. Voiceovers, bygg og renderinger regenereres bare når innhold endres."
    visual:
      animation: "cache-flow"

  - id: closing
    type: outro
    title: "Kom i gang"
    content:
      text: "Installer med pip install media-engine. Begynn å bygge på minutter."
    visual:
      cta: "pip install media-engine"
      link: "github.com/example/media-engine"
